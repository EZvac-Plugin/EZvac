# EZvac defaults. Durations use server ticks (20 ticks is normally one second).

# The unit players see and type temperatures in, everywhere: signs, chat, the
# HUD and placeholders (2.1). F or C. Typing 72F or 22C always works whatever
# this says. The temperatures in this file stay in F (their keys end in -f).
units: F

# Checks GitHub for a newer EZvac release (BETA 1.0), in the background: at
# start-up, then every 6 hours. A newer one is logged, and players with
# ezvac.admin hear about it when they join, with a link. It only reads
# GitHub's public list of releases. /hvac update checks when asked, even with
# check: false.
# channel (BETA 1.0 Pilot 2): which releases this server hears about.
#   stable: full releases and their hotfixes only.
#   pilot:  pilots too, the test builds before a full release.
#   auto:   follows the EZvac this server runs: pilot on a pilot, else stable.
# /hvac quicksettings › Updates switches it while the server runs.
updates:
  check: true
  notify-admins: true
  channel: auto

# Device kinds switched off server-wide (BETA 1.0): they stop, and no new one
# can be made; switched back on, each runs again as it was set. The kinds:
# heat-pump, air-conditioner, furnace, boiler, pool-heat-pump, dehumidifier,
# humidifier, air-purifier. /hvac quicksettings switches them while the server
# runs, as it does air-quality, pollen, wind and seasons below.
devices:
  disabled: []

# Backups of hvac.yml (with seasons.yml) in plugins/EZvac/backups (BETA 1.0).
# /hvac quicksettings makes one on demand. auto-every-hours makes one in real
# time, through restarts: 0 (off), 4, 8, 12, 24, 48 or 168 (a week); every
# 24 hours by default (BETA 1.0 Pilot 2). Only the newest keep automatic ones
# are kept; one made by hand is never deleted.
# To restore, stop the server and copy a backup over hvac.yml. If hvac.yml
# can't be read at start-up, EZvac falls back to the newest readable backup
# itself, or stops and /hvac quicksettings opens a recovery menu that
# restores one with a click.
backups:
  auto-every-hours: 24
  keep: 10

controller:
  period-ticks: 20
  save-period-ticks: 600
  display-period-ticks: 60
  cooling-start-above-f: 1.0
  heating-start-below-f: 1.0
  cooling-stop-below-f: 0.3
  heating-stop-above-f: 0.3
  minimum-run-ticks: 300
  minimum-off-ticks: 200

temperature:
  minimum-target-f: 60.0
  maximum-target-f: 85.0
  # Pool thermostats clamp to their own range: water that would make a pleasant
  # room is cold to swim in, and a hot tub would be unliveable as a room.
  pool-minimum-target-f: 75.0
  pool-maximum-target-f: 104.0
  cooling-f-per-minecraft-hour: 3.75
  heating-f-per-minecraft-hour: 5.0
  idle-drift-f-per-minecraft-hour: 1.25
  active-leak-f-per-minecraft-hour: 0.50
  # The most a system delivers, in units of one variable-speed unit in a
  # house its size; with sizing on, applied after its size scales it.
  maximum-group-capacity: 2.0

# Heat pumps and air conditioners slow down inside the approach band. Their
# RPM-derived capacity is the capacity used by the thermal simulation.
performance:
  variable-speed:
    approach-band-f: 3.0
    minimum-capacity: 0.40
    minimum-rpm: 1200.0
    maximum-rpm: 3600.0
    eco-maximum-rpm: 2400.0
    turbo-maximum-rpm: 4200.0
    ramp-up-rpm-per-second: 900.0
    ramp-down-rpm-per-second: 1200.0
  # Equipment tiers (3.1), shown as stars: the three kinds of real HVAC units.
  # Single-stage (one star) runs flat out or not at all, so it overshoots and
  # cycles. Two-stage (two) drops to its low stage within approach-band-f of
  # the target. Variable-speed (three) eases down smoothly on the curve above;
  # a variable furnace or boiler is called modulating. The cheaper kinds also
  # deliver less. Every unit from before 3.1 is variable, at full capacity:
  # compressors exactly as they ran, furnaces and boilers now modulating.
  tiers:
    single-stage:
      # What it delivers flat out, variable-speed being 1.
      capacity: 0.70
    two-stage:
      capacity: 0.85
      # Its low stage, as a share of flat out.
      low-stage: 0.65

airflow:
  core-range: 15
  maximum-range: 30
  nodes-per-tick: 4000
  maximum-cells-per-system: 200000

# Size-based heating and cooling (BETA 1.0). Units heat or cool the air their
# system reaches: one three-star unit is sized for cells-per-unit blocks of
# air, a floor of about 465 blocks, 4 blocks high. A two-star unit
# counts 0.85 of one, a one-star 0.70, and units add up. A bigger system needs
# more of them or is slower, and its screen says Undersized; a smaller one is
# quicker, up to maximum-speed-up times. Pools count water: pool-cells-per-unit
# blocks per heater. Air reaches only outdoor-reach blocks past a roof's edge;
# each block of opening to the sky (an open door, window or hole) makes a room
# leak more, opening-leak per opening block per 1,000 blocks of air, up to
# maximum-openness times a sealed room. Systems whose air touches even out
# through it (neighbour-exchange); a wall or a closed door insulates.
# enabled: false keeps the behaviour from before BETA 1.0; /hvac quicksettings
# switches it while the server runs. A server upgrading from ALPHA starts with
# it off, so its builds don't change until the owner switches it on.
sizing:
  enabled: true
  cells-per-unit: 1860
  pool-cells-per-unit: 1500
  maximum-speed-up: 2.0
  outdoor-reach: 3
  opening-leak: 1.1
  maximum-openness: 6.0
  neighbour-exchange: 10.0

audio:
  enabled: true
  radius-blocks: 25.0
  hum-refresh-ticks: 60
  # How often running systems' air vents play their airflow sound. 80 ticks is
  # how often a conduit plays the same sound.
  vent-airflow-refresh-ticks: 80
  # Every sound EZvac plays (2.0). Each line is "sound volume pitch",
  # a sound key such as block.beacon.ambient (resource pack sounds work too).
  # Lines in one list play together; [] silences that event. Pick mono sounds:
  # stereo ones, such as item.elytra.flying, sound the same at any distance.
  # The game plays pitch 0.5 to 2.0 only. Sounds fade with distance as in
  # vanilla and are only sent to players within radius-blocks.
  sounds:
    # Running heat pumps, air conditioners and boilers, every hum-refresh-ticks.
    equipment-hum: ["block.beacon.ambient 1.6 0.55"]
    furnace-start: ["block.wooden_button.click_on 0.5 1.8", "block.dispenser.fail 0.4 1.5", "item.firecharge.use 0.6 0.5"]
    furnace-stop: ["block.furnace.fire_crackle 0.25 0.6"]
    # Heat pumps, air conditioners and boilers.
    equipment-start: ["block.wooden_button.click_on 0.5 1.8", "block.piston.extend 0.4 0.5", "block.beacon.activate 0.3 0.5"]
    equipment-stop: ["block.wooden_button.click_off 0.5 1.5", "block.beacon.deactivate 0.3 0.5"]
    # Dehumidifiers and humidifiers switching on and off.
    unit-start: ["block.wooden_button.click_on 0.4 1.6"]
    unit-stop: ["block.wooden_button.click_off 0.4 1.4"]
    dehumidifier-start: ["block.beacon.activate 0.2 1.2"]
    dehumidifier-hum: ["block.beacon.ambient 0.64 0.88"]
    # A full tank starting to empty.
    dehumidifier-emptying: ["block.bubble_column.upwards_ambient 0.8 0.8"]
    # A running humidifier's slab, now and then.
    humidifier-bubbles: ["block.bubble_column.upwards_ambient 0.35 0.5"]
    # Air vents (iron trapdoors) of running systems near a player, one per
    # cluster of vents. Water vents stay quiet.
    vent-airflow: ["block.conduit.ambient 0.3 0.5"]

# Floating screens in front of EZvac's signs (2.1): a dark, lit panel
# with more room than a sign's four lines. The sign stays behind it, blank,
# so clicking works as before. Screens are never saved with the world.
# false shows the plain signs only, which are no longer supported (BETA 1.0):
# they get no new lines and may be removed in a later release.
displays:
  screens: true
  # How equipment tiers are drawn (3.1): full stars for the tier, empty ones
  # for the rest, so Standard is ★★☆. Change them for a resource pack, or for
  # Bedrock players through Geyser if their client draws these differently.
  stars:
    full: "★"
    empty: "☆"

# Transitions between biomes (2.1). The outdoor climate at a spot is the
# average of the biomes within radius-blocks, nearer ones counting more, so
# walking from plains into a desert ramps instead of jumping 28 F in a step.
# Temperature, humidity, weather and natural water all blend. 0 turns it off.
biome-blend:
  radius-blocks: 24

# The seasons (2.1). Each world with a sun keeps its own calendar in
# seasons.yml, starting from Minecraft's own day count (day 0 of a world is
# the first day of spring); /hvac season shows it and admins can change it
# (set, next, pause, resume). It follows the world's days, so sleeping and
# /time add move it on by every day they pass (BETA 1.0 Pilot 3), but setting
# the clock back never resets the year.
# Seasons move temperatures, and so whether rain falls as snow (BETA 1.0
# Pilot 4: see weather.dry-areas); biomes stay as they are. How far each
# biome moves is its own (plains: 90 F at noon in mid-summer, 54 F in
# mid-winter; a jungle barely changes); strength scales them all, 0.5 for
# mild seasons. Natural water follows water-lag-days behind the air.
# days-per-season can be changed at any time (restart after): each world
# keeps its season and day of season (BETA 1.0 Pilot 4; 30 by default since
# then, 15 before, and a server on the stock 15 moved to 30).
seasons:
  enabled: true
  days-per-season: 30
  strength: 1.0
  water-lag-days: 10.0

# Colder with height (2.1): the air cools lapse-f-per-block for every block
# above from-y. Real air cools about 0.012 F per metre, but Minecraft's
# mountains are short, so 0.1 makes a peak at y=200 about 14 F colder.
altitude:
  lapse-f-per-block: 0.1
  from-y: 64

# Deep underground the air holds the ground's steady temperature (2.1): no
# day/night swing, no seasons, no weather. It sets in start-depth blocks below
# the surface (or below sea level, where the surface is higher, so a hill or a
# tall house never counts) and is complete at full-depth.
underground:
  enabled: true
  start-depth: 4
  full-depth: 20

# Each biome's own climate (2.1). Every vanilla biome has a built-in one; to
# change it, or to give a data pack's biome its own, add it by its id. Values
# are year-round averages at sea level (altitude, the ground and the seasons
# come on top). Anything left out keeps the built-in value. For example:
#   minecraft:plains: { noon-f: 72, midnight-f: 50, seasonal-f: 18 }
#   mypack:volcano: { noon-f: 120, midnight-f: 100, seasonal-f: 0, precipitation: none }
biomes: {}

# Weather changes the outdoor air (2.0). Rain and thunder cool the day and
# narrow the day/night swing; snow cools a little. Vanilla weather switches in
# an instant, so the effect eases in and out over ease-hours (in-game hours).
# Deserts, savannas, badlands, the Nether and the End never get weather.
# Everything that uses the outdoor temperature follows: the HUD, idle drift,
# ETAs, thermometers and pools (natural water only takes water-share of it).
weather:
  enabled: true
  ease-hours: 2.0
  rain-cooling-f: 6.0
  thunder-cooling-f: 9.0
  snow-cooling-f: 3.0
  # Share of the day/night swing that full rain removes.
  swing-reduction: 0.6
  water-share: 0.1
  # Outdoor wind in m/s, used for "feels like". Indoors there is none. With
  # the daily wind on (wind: below), wind-clear-ms is unused, and rain and
  # thunder add (wind-rain-ms - wind-clear-ms) and (wind-thunder-ms -
  # wind-rain-ms) on top of the day's wind.
  wind-clear-ms: 1.5
  wind-rain-ms: 3.0
  wind-thunder-ms: 5.0
  # Rain or snow (BETA 1.0 Pilot 4): while it's raining, it snows wherever
  # EZvac's air is at or below snow-at-or-below-f, season, height and time of
  # day included, and rains elsewhere. Dry areas (deserts, badlands,
  # savannas) stay dry in ordinary rain: dry-areas is never (always dry, as
  # vanilla), thunder (rain only in thunderstorms) or always (rain like
  # anywhere else). EZvac's weather word, the HUD and sensors follow this;
  # an addon such as EZclimates can show it in the world.
  snow-at-or-below-f: 33.0
  dry-areas: thunder

# Humidity (2.0). Moisture is simulated as a dew point and shown as relative
# humidity, so heating a room lowers its RH and cooling dries it.
humidity:
  # Outdoor RH at the daily mean in the driest (desert) and wettest (jungle,
  # swamp) biomes; other biomes fall in between by their vanilla downfall.
  outdoor-rh-dry: 30.0
  outdoor-rh-wet: 90.0
  # Outdoor RH that full rain or snow pulls toward.
  rain-rh: 97.0
  # Share of the gap to the outdoor dew point a room closes per in-game hour.
  infiltration-per-hour: 0.15
  # Cooling equipment dries the air toward the coil's dew point.
  coil-dew-point-f: 45.0
  cooling-dry-f-per-minecraft-hour: 4.0
  # Water inside a room (a pool, a fountain) evaporates into its air; warmer
  # water evaporates faster.
  evaporation-f-per-minecraft-hour: 30.0

# Small differences from spot to spot (2.0), so a house isn't one
# number from wall to wall. Readings only: thermometers, sensors, the HUD,
# /hvac temperature and placeholders vary; thermostats, equipment and the
# simulation keep the room's own value. Values are the most a spot strays,
# in F either way. The variance changes gradually over spacing-blocks and
# drifts to new values over drift-hours (in-game hours). Between a room and
# the outdoors, or a pool and a lake, the spread blends with how far the
# system reaches. Humidity follows: a warmer spot reads a little drier.
variance:
  enabled: true
  indoor-f: 0.5
  outdoor-f: 1.5
  pool-f: 0.3
  natural-water-f: 0.8
  dew-point-f: 0.3
  spacing-blocks: 6.0
  drift-hours: 3.0

# Standalone dehumidifiers (2.0): an iron block on a waxed copper grate with a
# sign on the iron block, registered with /hvac create dehumidifier.
dehumidifier:
  # Reach of the unit's own airflow zone, in blocks (the same as a vent's).
  range: 30
  maximum-cells: 50000
  # Drying rate in a space of reference-cells; bigger spaces dry slower.
  dry-f-per-minecraft-hour: 3.0
  dry-dew-point-f: 35.0
  reference-cells: 1500
  # In-game hours of full-rate drying that fill the tank. When it's full the
  # grate fills with water and the unit empties it for empty-seconds.
  tank-fill-hours: 8.0
  empty-seconds: 30
  default-setpoint: 45
  # The setpoints the menu reaches (% RH): from the lowest to the highest here,
  # in steps of 5.
  presets: [35, 40, 45, 50, 55, 60]
  # It starts again once RH is this far above the setpoint.
  hysteresis: 2.0

# Standalone humidifiers (2.0): an iron block with a waxed cut copper
# slab on top and a sign on the iron block, registered with
# /hvac create humidifier. Plumbed: it never runs dry. While it runs the slab
# fills with water and bubbles.
humidifier:
  # Reach of the unit's own airflow zone, in blocks (the same as a vent's).
  range: 30
  maximum-cells: 50000
  # Moisture added in a space of reference-cells; bigger spaces gain slower.
  add-f-per-minecraft-hour: 3.0
  reference-cells: 1500
  default-setpoint: 40
  # The setpoints the menu reaches (% RH): from the lowest to the highest here,
  # in steps of 5.
  presets: [30, 35, 40, 45, 50]
  # It starts again once RH is this far below the setpoint.
  hysteresis: 2.0

# Air quality (3.2). Every room and standalone zone tracks fine particles
# (PM2.5), coarse particles (up to PM10) and pollen. The AQI is the US EPA
# index, the higher of the PM2.5 and PM10 scores; pollen has its own level and
# is not part of it. Outdoor air depends on the biome, the season's pollen and
# the rain; indoors, campfires, fire, lava, lit furnaces and candles add smoke.
# Rates are per in-game hour.
air-quality:
  # false hides every air reading, and air purifiers sit idle.
  enabled: true
  # false: no pollen outdoors or in, and readings say pollen is off (BETA 1.0).
  pollen: true
  # The space size sources and purifiers are quoted for, in airflow cells.
  # A bigger space dilutes both; a small one concentrates smoke, up to 4x.
  reference-cells: 1500
  # Share of each kind that settles out of still air per hour: big particles
  # fall fastest, so a closed room loses dust and pollen but keeps smoke.
  settling: { fine: 0.1, coarse: 0.3, pollen: 0.5 }
  # Share a system's own filter takes out per hour while its equipment runs.
  # It catches pollen and dust well, smoke poorly: that is a purifier's job.
  system-filter: { fine: 0.15, coarse: 0.5, pollen: 0.8 }
  # What one burning block adds per hour, in µg/m³, at reference-cells.
  sources:
    campfire: { fine: 20.0, coarse: 8.0 }
    fire: { fine: 25.0, coarse: 10.0 }
    lava: { fine: 6.0, coarse: 4.0 }
    # A lit furnace, smoker or blast furnace. EZvac's own furnaces and boilers
    # are sealed and add nothing.
    furnace: { fine: 4.0, coarse: 2.0 }
    candle: { fine: 1.0, coarse: 0.0 }
  # Pollen in grains/m³ where it turns Moderate, High and Very high.
  pollen-levels: { moderate: 20, high: 80, very-high: 200 }
  # Air purifiers: an iron block on a tube coral block, which is the filter,
  # with a sign on the iron block; /hvac create purifier.
  purifier:
    # Reach of the unit's own airflow zone, in blocks.
    range: 30
    maximum-cells: 50000
    # Share of each kind one purifier takes out per hour on High, at
    # reference-cells.
    rate: { fine: 2.5, coarse: 2.5, pollen: 3.0 }
    # Like a real one it has fan speeds, picked in its menu: how hard each
    # cleans, as a share of rate. New purifiers start in Auto.
    speeds: { low: 0.35, medium: 0.65, high: 1.0 }
    # Auto reads the air and picks a speed: Low in clean air, Medium past
    # medium-above-aqi or at medium-pollen, High past high-above-aqi or at
    # high-pollen (moderate, high, very-high or never). It steps down only
    # once the AQI is hysteresis under the step and the pollen a tenth under
    # its level, so it doesn't flicker between two speeds.
    auto:
      medium-above-aqi: 50
      high-above-aqi: 100
      medium-pollen: moderate
      high-pollen: high
      hysteresis: 20
    # What a filter holds, in µg/m³ caught at reference-cells (pollen
    # weighted by pollen-weight). The default lasts a few in-game days beside
    # a campfire and about two months running on High in clean air. A full
    # filter's coral dies; break it and place fresh tube coral.
    filter-capacity: 2400
    # A filter running nonstop on High in perfectly clean air still wears out
    # after this many in-game days; slower speeds wear it slower.
    maximum-life-days: 60
    pollen-weight: 0.5
  # Your own outdoor air per biome, over EZvac's figures: fine and coarse in
  # µg/m³, pollen in grains/m³ at its spring peak. Leave a value out to keep
  # EZvac's. For example:
  #   minecraft:plains: { pollen: 40 }
  #   my_pack:ash_wastes: { fine: 150, coarse: 200, pollen: 0 }
  biomes: {}

# Wind (3.2). Each day of a world draws a level, Calm, Breezy, Windy or Gale,
# from the world seed and the day, so it needs nothing saved and everyone
# gets the same wind. It gusts through the day, and storms add to it. High
# ground, the sea and open country are windier, forests sheltered; there is
# none underground, indoors, or outside the overworld. Wind makes outside
# feel colder, makes rooms leakier (they drift toward the outdoors faster,
# and systems work harder), lifts dust in dry biomes, thins smoke and
# spreads pollen. /hvac wind shows today's and the next days'.
# BETA 1.0 Pilot 3: it blows from a direction, and differs from one region to
# the next. Hot climates lie in the trade winds (from the east-northeast),
# temperate ones in the westerlies (from the west-southwest), cold ones in
# the polar easterlies (from the northeast); rain passing through turns the
# westerlies, south ahead of it, southwest while it rains, northwest after.
wind:
  # false: the fixed weather.wind-clear-ms, and wind changes nothing else.
  enabled: true
  # How often each level comes up, as weights.
  chances: { calm: 40, breezy: 35, windy: 18, gale: 7 }
  # Each level's daily mean speed, in m/s on open, level ground.
  speeds-ms:
    calm: [0, 2]
    breezy: [3, 6]
    windy: [7, 12]
    gale: [14, 20]
  # How much each season scales the chance of a Windy or Gale day; Calm days
  # take up the difference.
  seasons: { spring: 1.3, summer: 0.7, autumn: 1.3, winter: 1.0 }
  # How far the wind swings around the day's mean, as a share of it.
  gusts: 0.25
  # Extra air exchange per m/s of wind outside a room: at 0.05 a 20 m/s gale
  # makes it twice as leaky.
  infiltration-per-ms: 0.05
  maximum-infiltration: 2.0
  # How much dust a strong wind (over 6 m/s) lifts where the ground is dry:
  # a gale in a desert is a dust storm.
  dust: 1.5
  # Share of the outdoor smoke (PM2.5) the wind thins out per m/s, down to
  # 60% of it at most.
  smoke-dispersal: 0.03
  # Share the wind adds to the outdoor pollen per m/s, up to 1.8x.
  pollen-spread: 0.06
  # auto shows speeds in km/h with units C and mph with units F; or ms, kmh
  # or mph.
  units: auto
  # Your own exposure per biome, over EZvac's: 1 is open ground, 0.5 a dense
  # forest, 1.4 a mountain top, 0 no wind at all. For example:
  #   minecraft:plains: 1.2
  biomes: {}
  # Where it blows from (BETA 1.0 Pilot 3). variation: how far a day strays
  # from its climate's usual direction, 0 (never) to 2; fronts: whether the
  # wind turns ahead of and behind rain.
  direction:
    variation: 1.0
    fronts: true
  # Regions (BETA 1.0 Pilot 3): areas about size-blocks across where the wind
  # is windier or calmer than the day's, by up to strength (0.4: 40%) and
  # never by more than about a level. They drift downwind through the day.
  # enabled: false blows the same wind everywhere, terrain aside, as in 3.2.
  regions:
    enabled: true
    size-blocks: 1500
    strength: 0.4
    drift-blocks-per-hour: 150

# Weather stations (BETA 1.0): a tower of copper and iron with a sign, built
# by an admin (/hvac create weatherstation). It measures the outdoor climate
# around it and forecasts the next seven days; players near one see the
# forecast with /hvac forecast or by clicking its screen. It measures again at
# sunrise and sunset, and when the weather changes.
weather-stations:
  # How near a player must be to a station to see its forecast, in blocks.
  range: 400
  # The area a station measures: this far each way, and this far above it.
  area-radius: 100
  area-height: 20
  # Sparks at the lightning rods of a station that is on, when a player is near.
  sparks: true

# On-screen climate HUD and PlaceholderAPI placeholders (ALPHA 1.8).
# Players turn the HUD on or off for themselves with /hvac hud. Text uses
# MiniMessage (https://docs.advntr.dev/minimessage/format.html). Tokens:
# {temp} {feels} {humidity} {bar} {comfort} {outdoor} {weather} {season} {season_day}
# {aqi} {aqi_band} {pollen} {wind} {wind_level} {wind_direction} {wind_degrees}
# {time} {system} {thermostat} {mode} {target} {zone} {mode_icon} {version}
# {mode_icon} is what the system is doing as an icon (BETA 1.0): ♨ heating,
# ❄ cooling, ● holding, ⚠ its units are switched off, ○ outside any system.
# {aqi} is the Air Quality Index in its band's colour; {aqi_band} is Good,
# Moderate, Sensitive, Unhealthy, Very bad or Hazardous (3.2).
# {wind} is the wind you feel, such as "Windy 22 km/h W"; {wind_level} just the
# word: Calm, Breezy, Windy or Gale (3.2). {wind_direction} is where it blows
# from, N to NW, and {wind_degrees} the same in degrees, 0 north (BETA 1.0
# Pilot 3); a calm day has none. {time} is the time of day, such as "14:30"
# (BETA 1.0 Pilot 3); without seasons, the stock season line shows it alone.
# {system} is the label of the thermostat whose air you are in (3.0); {group}, its
# old name, still works.
# In air, {bar} and {comfort} follow {feels}: humid heat reads hotter, wind colder.
# Addons can add their own sections (such as LiveExposure's body temperature):
# a sidebar line that is just {addons} shows every addon section there, and a
# line that is just {section:<id>} shows one section on its own. In the
# actionbar and bossbar formats, {section:<id>} shows that section on one line.
# The sidebar shows at most 15 lines: your own lines always fit, and addon
# sections that would go past that are left out, whole.
hud:
  enabled: true
  # sidebar (scoreboard on the right), actionbar (above the hotbar) or bossbar (top)
  style: sidebar
  update-ticks: 10
  # Shown where no system conditions the air.
  none-text: none
  sidebar:
    # EZvac never takes over a sidebar another plugin or the server is using;
    # servers with their own scoreboard plugin can use the placeholders instead.
    title: "<gradient:#3999fb:#f69500><bold>Climate</bold></gradient> <dark_gray>-</dark_gray> <gray>EZvac"
    # In sections since BETA 1.0: Here, Outside and System, each under an
    # accent heading. {system_mode} is the system and what it's doing
    # ("Home1: Holding 72.0°F"), or the none-text outside any system.
    lines:
      - "<aqua>▍<white>Here <dark_gray>──────────"
      - " <white>{temp} <gray>feels <white>{feels}"
      - " {bar} {comfort}"
      - "<gray> Humidity <white>{humidity}"
      - "<gray> Air {aqi} <white>{aqi_band} <dark_gray>· <gray>✿ <white>{pollen}"
      - "<aqua>▍<white>Outside <dark_gray>────────"
      - " <white>{outdoor} <gray>{weather}"
      - "<gray> Wind <white>{wind}"
      - "<gray> {season}, day {season_day} <dark_gray>· <white>{time}"
      - "{addons}"
      - "<aqua>▍<white>System <dark_gray>─────────"
      - " {mode_icon} {system_mode}"
      - "<gray> Airflow <white>{zone}"
      # {version} is the short EZvac version: A1.8, or A1.8_H1 for a hotfix.
      # <font:uniform> is Minecraft's narrower built-in font, for a quieter footer.
      - "<dark_gray><font:uniform>Version: {version}</font>"
    # Scoreboard plugins that draw their own sidebar. If any is installed, the
    # HUD uses the action bar instead so it never covers the server's board;
    # put %ezvac_temp% and friends into that plugin's scoreboard instead.
    # Empty the list to always use the sidebar.
    yield-to-plugins: [TAB, FeatherBoard, AnimatedScoreboard, SimpleScore, KiteBoard, QuickBoard, TitleManager, BetterScoreboard]
  actionbar:
    format: "<white>{temp}</white> {bar} {comfort} <dark_gray>|</dark_gray> <gray>{humidity} <dark_gray>|</dark_gray> <gray>{system}"
  bossbar:
    format: "<white>{temp}</white> <gray>feels {feels} -</gray> {comfort} <dark_gray>|</dark_gray> <gray>{system}"
  sections:
    # Addon sections to never show, by id (/hvac hud sections lists them),
    # such as [liveexposure:body].
    hidden: []
  bar:
    # gauge (BETA 1.0): one line coloured from cold to hot along the scale,
    # with the marker where it feels. blocks: filled and empty glyphs, the
    # bar from before.
    style: gauge
    gauge: "━"
    marker: "◆"
    length: 10
    filled: "▮"
    empty: "▯"
    empty-color: "#4a4a4a"
    # The bar is empty at cold-f and full at hot-f.
    cold-f: 50.0
    hot-f: 95.0
  comfort:
    cold: { below-f: 60.0, label: Cold, color: "#5ab0ff" }
    cool: { below-f: 68.0, label: Cool, color: "#8fd3ff" }
    comfortable: { label: Comfortable, color: "#6ee07a" }
    warm: { above-f: 78.0, label: Warm, color: "#ffb347" }
    hot: { above-f: 86.0, label: Hot, color: "#ff5c5c" }
  # Shown instead of the settings above while the player is in water. A pool
  # has its own scale: 84 F is a pleasant swim, and above 95 F it's a hot tub.
  # Unconditioned water reads the biome's natural water temperature.
  water:
    sidebar:
      lines:
        - "<aqua>▍<white>Water <dark_gray>──────────"
        - " <white>{temp}"
        - " {bar} {comfort}"
        - "<aqua>▍<white>Outside <dark_gray>────────"
        - "<gray> Air <white>{outdoor} <gray>{weather}"
        - "{addons}"
        - "<aqua>▍<white>Pool <dark_gray>───────────"
        - " {mode_icon} {system_mode}"
        - "<gray> Circulation <white>{zone}"
        - "<dark_gray><font:uniform>Version: {version}</font>"
    actionbar:
      format: "<aqua>Water</aqua> <white>{temp}</white> {bar} {comfort} <dark_gray>|</dark_gray> <gray>{system}"
    bossbar:
      format: "<aqua>Water</aqua> <white>{temp}</white> <gray>-</gray> {comfort} <dark_gray>|</dark_gray> <gray>{system}"
    bar:
      cold-f: 60.0
      hot-f: 104.0
    comfort:
      cold: { below-f: 70.0, label: Cold, color: "#5ab0ff" }
      cool: { below-f: 78.0, label: Cool, color: "#8fd3ff" }
      comfortable: { label: Comfortable, color: "#6ee07a" }
      warm: { above-f: 86.0, label: Warm, color: "#ffb347" }
      hot: { above-f: 95.0, label: Hot tub, color: "#ff5c5c" }
