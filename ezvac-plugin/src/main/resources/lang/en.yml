tutorial:
  already: "You're in the tutorial already. /hvac tutorial leave takes you back."
  no-world: "The tutorial world couldn't be made: see the console."
  title: "Build your first system"
  subtitle: "A heat pump, a thermostat and vents"
  done-title: "Your first system works"
  done-subtitle: "The hut heats to 75 degrees"
  back-button: "[Back to my world]"
  back-hover: "With your things, where you were"
  click-to-chat: "Click to put it in chat"
  welcome: "Welcome to EZvac's tutorial. This hut needs heating. You'll build a heat pump, a thermostat and vents, and link them. /hvac tutorial leave takes you back any time, with your things."
  back: "Back where you were, with your things. /hvac tutorial runs it again any time."
  back-while-away: "You left the tutorial while away: you're back where you were, with your things."
  done:
    dispenser: "The dispenser is in."
    heat-pump: "EZvac knows it's a heat pump now."
    thermostat: "The thermostat is in."
    vents: "The vents are in."
    linked: "Everything is linked: the heat pump is running."
    casing: "The casing is built."
  leaks: "Notice the red glowing blocks outside the door? Those are openings, where the room leaks air, and they work against your system. Close your doors, and don't leave gaps in your walls!"
  sealed: "Your room is sealed: nothing glows red. Open the door and red glowing blocks show where air leaks out. Openings work against your system, so close your doors, and don't leave gaps in your walls!"
  leaks-hint: "Holding the link tool with the thermostat selected always shows them, in any system."
  step:
    dispenser: "Step 1 of 6: the heat pump. Every heat pump, air conditioner and furnace is a dispenser. Place one where the glowing dispenser is, beside the hut, facing up."
    dispenser-hint: "Look down at the ground as you place it, so it faces up."
    heat-pump: "Step 2 of 6: tell EZvac what it is. Look at the glowing dispenser and type:"
    heat-pump-hint: "The same dispenser becomes an air conditioner with /hvac create ac, or a furnace with /hvac create furnace: what it is comes from how you create it."
    thermostat: "Step 3 of 6: the thermostat. Go inside the hut: the glowing sign shows where it goes, on the inside of the north wall. Place the sign there, then look at it and type:"
    vents: "Step 4 of 6: vents. The glowing trapdoors under the ceiling show where: place an iron trapdoor in each of the four. Air from the heat pump comes into the room through them."
    link: "Step 5 of 6: link them. You've been given the link tool. Right-click the thermostat to select its system, then right-click each glowing vent and the heat pump's dispenser: each stops glowing once it's linked."
    link-hint: "Right-click the thermostat again any time to see what's linked."
    casing: "Step 6 of 6: the casing. The heat pump works already: water appears above the dispenser while it runs. The glowing blocks show the usual casing around it, with a glass window to watch the water. Fill them in with any blocks you like."
    casing-hint: "That's the usual look, not a rule: build heat pumps, air conditioners and furnaces however you like. Just leave the block above the dispenser free."
  finished: "That's a whole system: the thermostat calls for heat, the heat pump runs, and warm air reaches the room through the vents. Watch its screen, and stand inside: your HUD shows the room warming."
  thermostat-inside: "The thermostat goes on the inside of the wall, where the glowing sign is."
  kept-from-earlier: "<yellow>Your things from an earlier tutorial are still kept aside. Rejoin to get them back, then start the tutorial again."
  not-safe: "<red>Your things couldn't be kept safe, so the tutorial didn't start: see the console."
  trip-stopped: "<red>Another plugin stopped the trip to the tutorial world, so it didn't start."
  unreadable: "<red>Your things from before the tutorial couldn't be read back. They aren't lost: an admin can find them in plugins/EZvac/tutorial."
