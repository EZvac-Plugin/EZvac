      made-weather: "<green>Created <kind> sensor '<name>'. Link it to a sensor hub with /hvac link-tool. It needs open sky above it, like a rain gauge."
      made-wind: "<green>Created <kind> sensor '<name>'. Link it to a sensor hub with /hvac link-tool. Put it up high in the open: walls and roofs shelter it."
    sensor-hub: "<green>Created sensor hub '<name>'. Link up to <max> sensors to it with /hvac link-tool."
