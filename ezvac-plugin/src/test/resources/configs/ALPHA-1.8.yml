# EZvac defaults. Durations use server ticks (20 ticks is normally one second).
controller:
  period-ticks: 20
  save-period-ticks: 600
  display-period-ticks: 60
  cooling-start-above-f: 1.0
  heating-start-below-f: 1.0
  cooling-stop-below-f: 0.3
  heating-stop-above-f: 0.3
  minimum-run-ticks: 300
  minimum-off-ticks: 200

temperature:
  minimum-target-f: 60.0
  maximum-target-f: 85.0
  # Pool thermostats clamp to their own range: water that would make a pleasant
  # room is cold to swim in, and a hot tub would be unliveable as a room.
  pool-minimum-target-f: 75.0
  pool-maximum-target-f: 104.0
  cooling-f-per-minecraft-hour: 3.75
  heating-f-per-minecraft-hour: 5.0
  idle-drift-f-per-minecraft-hour: 1.25
  active-leak-f-per-minecraft-hour: 0.50
  maximum-group-capacity: 2.0

# Heat pumps and air conditioners slow down inside the approach band. Their
# RPM-derived capacity is the capacity used by the thermal simulation.
performance:
  variable-speed:
    approach-band-f: 3.0
    minimum-capacity: 0.40
    minimum-rpm: 1200.0
    maximum-rpm: 3600.0
    eco-maximum-rpm: 2400.0
    turbo-maximum-rpm: 4200.0
    ramp-up-rpm-per-second: 900.0
    ramp-down-rpm-per-second: 1200.0

airflow:
  core-range: 15
  maximum-range: 30
  nodes-per-tick: 4000
  maximum-cells-per-system: 200000

audio:
  enabled: true
  radius-blocks: 25.0
  hum-refresh-ticks: 60
  hum-volume: 1.6
  hum-pitch: 0.55

# On-screen climate HUD and PlaceholderAPI placeholders (ALPHA 1.8).
# Players turn the HUD on or off for themselves with /hvac hud. Text uses
# MiniMessage (https://docs.advntr.dev/minimessage/format.html). Tokens:
# {temp} {bar} {comfort} {outdoor} {group} {thermostat} {mode} {target} {zone} {version}
hud:
  enabled: true
  # sidebar (scoreboard on the right), actionbar (above the hotbar) or bossbar (top)
  style: sidebar
  update-ticks: 10
  units: F
  # Shown where no system conditions the air.
  none-text: none
  sidebar:
    # EZvac never takes over a sidebar another plugin or the server is using;
    # servers with their own scoreboard plugin can use the placeholders instead.
    title: "<gradient:#3999fb:#f69500><bold>Climate</bold></gradient> <dark_gray>-</dark_gray> <gray>EZvac"
    lines:
      - "<gray>Here: <white>{temp}"
      - "{bar} {comfort}"
      - "<gray>Outside: <white>{outdoor}"
      - ""
      - "<gray>System: <white>{group}"
      - "<gray>Mode: <white>{mode}"
      - "<gray>Airflow: <white>{zone}"
      # {version} is the short EZvac version: A1.8, or A1.8_H1 for a hotfix.
      # <font:uniform> is Minecraft's narrower built-in font, for a quieter footer.
      - "<dark_gray><font:uniform>Version: {version}</font>"
    # Scoreboard plugins that draw their own sidebar. If any is installed, the
    # HUD uses the action bar instead so it never covers the server's board;
    # put %ezvac_temp% and friends into that plugin's scoreboard instead.
    # Empty the list to always use the sidebar.
    yield-to-plugins: [TAB, FeatherBoard, AnimatedScoreboard, SimpleScore, KiteBoard, QuickBoard, TitleManager, BetterScoreboard]
  actionbar:
    format: "<white>{temp}</white> {bar} {comfort} <dark_gray>|</dark_gray> <gray>{group}"
  bossbar:
    format: "<white>{temp}</white> <gray>-</gray> {comfort} <dark_gray>|</dark_gray> <gray>{group}"
  bar:
    length: 10
    filled: "▮"
    empty: "▯"
    empty-color: "#4a4a4a"
    # The bar is empty at cold-f and full at hot-f.
    cold-f: 50.0
    hot-f: 95.0
  comfort:
    cold: { below-f: 60.0, label: Cold, color: "#5ab0ff" }
    cool: { below-f: 68.0, label: Cool, color: "#8fd3ff" }
    comfortable: { label: Comfortable, color: "#6ee07a" }
    warm: { above-f: 78.0, label: Warm, color: "#ffb347" }
    hot: { above-f: 86.0, label: Hot, color: "#ff5c5c" }
