# What translators see in Weblate's "Explanation" box, for strings whose meaning
# isn't obvious from the English alone. Keys as in ezvac-plugin/src/main/resources/lang/en.yml.
# Sent to Weblate by set-explanations.py; LangTest checks every key here still exists.
#
# "New-look screen" = the big picture screens on devices; "sign" = the classic sign text;
# both are tiny, so keep these about as short as the English.

time.seconds: "A duration in seconds, as in \"12 s\". Unit abbreviation; keep it short."
time.minutes: "A duration in minutes, as in \"5 min\". Unit abbreviation."
time.hours-minutes: "A duration, as in \"2 h 15 min\". Unit abbreviations."
time.ago.now: "Quick settings: how long ago something happened (like the last backup), under a minute."

device.tier.single-stage: "A heating/cooling unit's tier: runs only fully on or fully off."
device.tier.two-stage: "A unit's tier: has a low and a high setting."
device.tier.variable: "A unit's tier: its speed varies smoothly (inverter)."
device.tier.modulating: "A furnace or boiler's tier: its flame varies smoothly."
device.purifier-auto: "An air purifier on automatic, with the speed it picked now, as in \"Auto · High\"."
device.station-part.iron: "A block the weather station's tower is missing; completes \"The tower needs ... at x, y, z\"."
device.station-part.cut-copper: "A block the weather station's tower is missing; completes \"The tower needs ... at x, y, z\"."
device.sensor.both: "What a combined sensor measures: temperature and humidity together."

