screen.off: "New-look screen: a device that is switched off. Lower case, tiny label."
screen.stopped: "New-look thermostat screen: the system can't run (no unit or no vent)."
screen.set: "New-look screen: the target it's set to, as in \"set 70°F\". Short for \"setpoint\"."
