screen.pool-hp: "Abbreviation of \"pool heat pump\" on the RPM monitor; very short."
screen.furn: "Abbreviation of \"furnace\" on a narrow sign; about 4 letters."
screen.boil: "Abbreviation of \"boiler\" on a narrow sign; about 4 letters."
screen.php: "Abbreviation of \"pool heat pump\" on a narrow sign; about 3 letters."
screen.mini-set: "Mini thermostat (a small screen on a button): its target, as in \"Set 70°F\"."
