screen.air-off: "New-look air monitor screen when air quality is switched off on the server."
screen.mostly: "New-look air screen: what mostly pollutes the air, as in \"mostly smoke\"."
screen.not-linked: "New-look screen: the device isn't linked to a system yet."
screen.tank: "Label for a dehumidifier's water tank level (a bar next to it)."
screen.filter: "Label for an air purifier's filter life (a bar next to it)."
screen.auto: "A button on the purifier screen: automatic fan speed."
