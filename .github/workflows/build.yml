# Builds EZvac and runs its test suite on a clean machine.
#
# "on:" lists the events that start this workflow.
name: Build

on:
  push:
    branches: [main]          # every push to main
  pull_request:
    branches: [main]          # every pull request targeting main
  workflow_dispatch:          # lets you run it by hand from the Actions tab

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest    # a fresh throwaway Linux machine, per run

    steps:
      # Copy the repository onto the machine.
      - name: Check out the repository
        uses: actions/checkout@v4

      # Install Java 21 and cache the Maven dependency downloads, so later
      # runs do not re-download paper-api and fastutil every time.
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # -B is "batch mode": no interactive prompts, cleaner logs.
      # "verify" runs the full lifecycle including the test suite, for both
      # modules: ezvac-api and ezvac-plugin.
      - name: Build and run tests
        run: mvn -B clean verify

      # Keep the built jar so you can download it from the run's summary page.
      # Useful for testing a contributor's pull request without building it
      # yourself. Retained for 30 days.
      - name: Upload the built jar
        uses: actions/upload-artifact@v4
        with:
          name: EzVac-jar
          path: ezvac-plugin/target/EzVac-*.jar
          if-no-files-found: error
          retention-days: 30

  # The jar is built against the Paper 1.21.1 API so one jar runs on 1.21.1
  # and on 26.1 to 26.3 (BETA 1.0). This job compiles the same code and tests
  # against the 26.1 API too, on the Java 25 that Paper 26.x needs, so code
  # that 26.x removed fails here before it reaches a server.
  compile-26:
    name: Compile against Paper 26.1
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Compile the plugin and its tests
        run: mvn -B -Dpaper.version=26.1.2.build.74-stable -Dmaven.compiler.release=25 clean test-compile
